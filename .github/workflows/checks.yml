name: HSMP manager checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax-and-maintenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run shell syntax and offline maintenance tests
        run: bash tests/syntax-check.sh
